# Research interests (the Research Interests section and the colored chips).
# Each paper in _papers/ lists research-area keys in `topics:` (colored chips) and
# free-form topics in `tags:` (gray chips). `papers:` is the list shown in the
# Research Interests section, by slug; `hue` is the chip color (0-360).

themes:
  - name: AI Safety & LLM Privacy
    label: AI safety
    dates: Aug 2025 – Present
    topics:
      - key: ai-safety
        name: AI Safety
        desc: projection- and diffusion-based methods that estimate rare LLM failures from black-box access, dialect-based jailbreaks, and detecting deception by LLM agents that conceal their intent
        hue: 0
        papers: [behavioral-tails, diffusion-perplexity-aware-attacks, dia-harm, moderation-by-interrogation]
      - key: interpretability
        name: Interpretability
        desc: inferring what an LLM agent is actually pursuing, through a multi-turn dialogue method that interrogates it and reads its hidden intent from its answers
        hue: 300
        papers: [moderation-by-interrogation]
      - key: pretraining-safety
        name: Pretraining Safety
        desc: contamination-resistant LLM benchmarks built on Transformer asymmetry and dynamic graph construction, and ali-llm, an open testbed for safe curriculum pretraining
        hue: 270
        papers: [contamination-resistant-benchmarks]
        extra:
          - { name: ali-llm, url: "https://huggingface.co/aliwister/ali-llm-v0.1" }

  - name: Retrieval-Augmented Generation & Multimodal AI
    label: RAG & multimodal
    dates: May 2024 – Present
    topics:
      - key: icl
        name: In-Context Learning
        desc: graph-based retrieval and reranking methods that select structurally aligned in-context examples
        hue: 210
        papers: [gamic, semantic-captioning-sql2text]
      - key: mm-privacy
        name: Multimodal Privacy
        desc: membership inference and image-caption retrieval attacks that expose private-data leakage in multimodal RAG systems across deployment settings
        hue: 165
        papers: [multimodal-rag-privacy]

  - name: Graph-Based Machine Learning
    label: Graph ML
    dates: Aug 2022 – May 2024
    topics:
      - key: geo-graph
        name: Geospatial Graph Learning
        desc: a graph-based recurrent autoencoder that generates realistic long-horizon wildlife trajectories from limited samples
        hue: 95
        papers: [wildgraph, wildgen]

# Order of the gray topic chips in the filter bar
tags:
  - Black-Box LLMs
  - Rare-Event Simulation
  - Diffusion LMs
  - LLM Agents
  - Bayesian Inference
  - Privacy
  - RAG
  - Membership Inference
  - Benchmarks
  - Multilingual
  - Graph Learning
  - Summarization
  - Generative Models
  - Survey
