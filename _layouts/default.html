<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="{{ site.author.name }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.author.avatar | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="{{ '/images/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <script>
    // Set the theme before first paint to avoid a flash
    (function () {
      var t = localStorage.getItem('theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "jobTitle": {{ site.author.role | jsonify }},
    "affiliation": {{ site.author.affiliation | jsonify }},
    "url": {{ site.url | jsonify }},
    "image": {{ site.author.avatar | absolute_url | jsonify }},
    "sameAs": [{{ site.author.scholar | jsonify }}, "https://github.com/{{ site.author.github }}"]
  }
  </script>
</head>
<body id="top">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
      <nav class="nav" aria-label="Sections">
        <a href="{{ '/#about' | relative_url }}">About</a>
        <a href="{{ '/#news' | relative_url }}">News</a>
        <a href="{{ '/#publications' | relative_url }}">Publications</a>
        <a href="{{ '/#experience' | relative_url }}">Experience</a>
        <a href="{{ '/#teaching' | relative_url }}">Teaching</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <span class="when-light">{% include icon.html name="moon" %}</span>
        <span class="when-dark">{% include icon.html name="sun" %}</span>
      </button>
    </div>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      © {{ site.time | date: '%Y' }} {{ site.author.name }} · Last updated {{ site.time | date: '%B %Y' }}
    </div>
  </footer>

  <a class="to-top" href="#top" aria-label="Back to top">{% include icon.html name="up" %}</a>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
