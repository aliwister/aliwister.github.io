{% assign p = include.p %}
{% assign names = p.authors | remove: "†" | split: ", " %}
{% assign url = p.url | absolute_url %}
  <!-- Google Scholar / Zotero (Highwire Press tags) -->
  <meta name="citation_title" content="{{ p.title | escape }}">
  {% for n in names %}<meta name="citation_author" content="{{ n | strip | escape }}">
  {% endfor %}<meta name="citation_publication_date" content="{{ p.date | date: '%Y/%m/%d' }}">
  {% if p.conference %}<meta name="citation_conference_title" content="{{ p.conference | escape }}">{% endif %}
  {% if p.doi %}<meta name="citation_doi" content="{{ p.doi }}">{% endif %}
  {% if p.arxiv %}<meta name="citation_arxiv_id" content="{{ p.arxiv }}">{% endif %}
  {% if p.pdf %}<meta name="citation_pdf_url" content="{{ p.pdf }}">{% endif %}
  <meta name="citation_abstract_html_url" content="{{ url }}">
  <meta property="article:published_time" content="{{ p.date | date_to_xmlschema }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ScholarlyArticle",
    "@id": {{ url | append: "#article" | jsonify }},
    "headline": {{ p.title | jsonify }},
    "name": {{ p.title | jsonify }},
    {% if p.alt_title %}"alternativeHeadline": {{ p.alt_title | jsonify }},{% endif %}
    "abstract": {{ p.abstract | strip_html | jsonify }},
    "datePublished": {{ p.date | date: '%Y-%m-%d' | jsonify }},
    "inLanguage": "en",
    "isAccessibleForFree": true,
    "url": {{ url | jsonify }},
    "mainEntityOfPage": {{ url | jsonify }},
    "author": [{% for n in names %}{% assign n = n | strip %}
      {% if n == site.author.name %}{ "@type": "Person", "@id": {{ site.url | append: "/#person" | jsonify }}, "name": {{ n | jsonify }}, "url": {{ site.url | append: "/" | jsonify }} }{% else %}{ "@type": "Person", "name": {{ n | jsonify }} }{% endif %}{% unless forloop.last %},{% endunless %}{% endfor %}
    ],
    {% if p.conference %}"isPartOf": { "@type": "PublicationVolume", "name": {{ p.conference | jsonify }} },{% endif %}
    {% if p.award %}"award": {{ p.award | jsonify }},{% endif %}
    "identifier": [{% if p.doi %}{ "@type": "PropertyValue", "propertyID": "DOI", "value": {{ p.doi | jsonify }} }{% if p.arxiv %},{% endif %}{% endif %}{% if p.arxiv %}{ "@type": "PropertyValue", "propertyID": "arXiv", "value": {{ p.arxiv | jsonify }} }{% endif %}],
    "sameAs": [{% for l in p.links %}{% if l.name == "arXiv" or l.name == "Proceedings" %}{% unless first_done %}{% assign first_done = true %}{% else %},{% endunless %}{{ l.url | jsonify }}{% endif %}{% endfor %}]
  }
  </script>
